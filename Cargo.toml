[package]
name = "convertetudo"
version = "1.0.0"
edition = "2021"
description = "Conversor local de documentos. O arquivo não sai da máquina."
license = "MIT"
readme = "README.md"
authors = ["ConverteTudo"]

[[bin]]
name = "convertetudo"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
panic = "abort"
strip = true
